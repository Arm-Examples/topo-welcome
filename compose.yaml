services:
  app:
    build: 
      context: .
      args:
        GREETING_NAME: ${GREETING_NAME:-World}
    platform: linux/arm64
    ports:
      - "8000:80"

x-topo:
  name: "Hello World"
  description: |
    A minimal "Hello, World" web app for validating a Topo setup and deployment.
    It runs a single service that exposes a web page on the target,
    with the greeting text customizable via the GREETING_NAME parameter.
  deployment_success_message: |
    Topo "Hello World" deployed successfully. Open http://${TOPO_TARGET_HOSTNAME:-<target-hostname>}:8000 in a browser to view the greeting page.

  args: &args
    GREETING_NAME:
      description: The text to use in the greeting message
      example: "Markus"
  parameters: *args
