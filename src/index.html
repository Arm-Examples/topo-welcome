<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topo Hello</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0a0a0a;
        color: #e0e0e0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 1.5rem 2rem;
        border-bottom: 1px solid #222;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 300;
      }

      .logo .brand {
        color: #9b59b6;
      }

      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2rem;
        text-align: center;
      }

      .emoji-container {
        display: flex;
        gap: 2rem;
        margin-bottom: 2rem;
        align-items: center;
      }

      .emoji {
        font-size: 6rem;
        animation: bounce 2s infinite;
      }

      .emoji:nth-child(1) {
        animation-delay: 0s;
      }

      .emoji:nth-child(2) {
        animation-delay: 0.3s;
      }

      .greeting {
        font-size: 2.5rem;
        font-weight: 300;
        margin-bottom: 1rem;
        background: linear-gradient(45deg, #9b59b6, #60a5fa, #34d399);
        background-size: 300% 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradient-shift 3s ease-in-out infinite;
      }

      .subtext {
        font-size: 1.2rem;
        color: #aaa;
        font-weight: 300;
        opacity: 0;
        animation: fade-in 1s ease-in-out 1s forwards;
      }

      @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-30px);
        }
        60% {
          transform: translateY(-15px);
        }
      }

      @keyframes gradient-shift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .floating {
        animation: float 3s ease-in-out infinite;
      }

      @media (max-width: 768px) {
        .emoji {
          font-size: 4rem;
        }
        
        .emoji-container {
          gap: 1rem;
        }
        
        .greeting {
          font-size: 2rem;
        }
        
        .subtext {
          font-size: 1rem;
        }
        
        .container-info {
          font-size: 0.8rem;
          padding: 1rem 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="logo">arm<span class="brand">topo</span></h1>
    </header>

    <div class="main-content">
      <div class="emoji-container">
        <span class="emoji">👋</span>
        <span class="emoji floating">🐳</span>
      </div>
      
      <h1 class="greeting">Hello {{GREETING_NAME}}, from a Topo container</h1>
      
      <p class="subtext">You have successfully deployed to your device.</p>
    </div>
  </body>
</html>
